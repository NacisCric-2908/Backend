<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini chat WebSocket</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f2f4f8;
      color: #1d2433;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .chat {
      width: 100%;
      max-width: 640px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid #e3e7ee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    .estado { font-size: .85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .estado::before {
      content: ''; width: 10px; height: 10px; border-radius: 50%; background: currentColor;
    }
    .estado.conectado { color: #1a8f4c; }
    .estado.desconectado { color: #c0392b; }
    .estado.conectando { color: #c98a00; }

    #mensajes { flex: 1; overflow-y: auto; padding: 16px 18px; list-style: none; margin: 0; }
    #mensajes li { margin-bottom: 10px; line-height: 1.4; }
    .meta { font-size: .75rem; color: #6b7485; }
    .chat-msg .autor { font-weight: 600; color: #2457c5; }
    .sistema { color: #6b7485; font-style: italic; font-size: .9rem; text-align: center; }

    form { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid #e3e7ee; flex-wrap: wrap; }
    input { padding: 10px; border: 1px solid #cfd5df; border-radius: 8px; font-size: 1rem; }
    #autor { width: 140px; }
    #texto { flex: 1; min-width: 160px; }
    button {
      padding: 10px 18px; border: 0; border-radius: 8px; background: #2457c5;
      color: #fff; font-size: 1rem; cursor: pointer;
    }
    button:disabled { background: #9aa6bd; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>Mini chat WebSocket</h1>
      <span id="estado" class="estado desconectado">Desconectado</span>
    </header>

    <ul id="mensajes"></ul>

    <form id="formulario">
      <input id="autor" placeholder="Tu nombre" maxlength="30" required>
      <input id="texto" placeholder="Escribe un mensaje…" autocomplete="off" required>
      <button id="boton" type="submit" disabled>Enviar</button>
    </form>
  </main>

  <script>
    // El servidor reemplaza este valor por la variable WS_URL del archivo .env
    const WS_URL = "__WS_URL__";

    const lista = document.getElementById('mensajes');
    const estado = document.getElementById('estado');
    const formulario = document.getElementById('formulario');
    const inputAutor = document.getElementById('autor');
    const inputTexto = document.getElementById('texto');
    const boton = document.getElementById('boton');

    let ws;               // la conexión WebSocket actual
    let intentos = 0;     // reintentos seguidos, para calcular la espera

    // Cambia el indicador de estado y habilita o no el botón
    function ponerEstado(clase, texto) {
      estado.className = 'estado ' + clase;
      estado.textContent = texto;
      boton.disabled = clase !== 'conectado';
    }

    // Pinta un mensaje { tipo, autor, texto, hora } en la lista.
    // Usamos textContent (no innerHTML) para que nadie pueda inyectar HTML.
    function mostrar(msg) {
      const li = document.createElement('li');
      const hora = msg.hora ? new Date(msg.hora).toLocaleTimeString() : '';

      if (msg.tipo === 'chat') {
        li.className = 'chat-msg';
        const autor = document.createElement('span');
        autor.className = 'autor';
        autor.textContent = msg.autor + ': ';
        li.append(autor, msg.texto);
      } else {
        li.className = 'sistema';
        li.textContent = msg.texto;
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = hora;
      li.append(meta);

      lista.append(li);
      lista.scrollTop = lista.scrollHeight;
    }

    // Abre la conexión y define qué hacer con cada evento
    function conectar() {
      ponerEstado('conectando', 'Conectando…');
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        intentos = 0; // se reinicia la espera al conectar bien
        ponerEstado('conectado', 'Conectado');
      };

      // Llega un mensaje del servidor: no tuvimos que pedirlo (no hay sondeo)
      ws.onmessage = (e) => mostrar(JSON.parse(e.data));

      // Se cerró la conexión: reintentamos con espera creciente
      // 1 s, 2 s, 4 s, 8 s, 16 s y como máximo 30 s
      ws.onclose = () => {
        const espera = Math.min(1000 * 2 ** intentos, 30000);
        intentos++;
        ponerEstado('desconectado', `Desconectado · reintento en ${espera / 1000} s`);
        setTimeout(conectar, espera);
      };
    }

    // Enviar un mensaje por la misma conexión abierta
    formulario.onsubmit = (e) => {
      e.preventDefault(); // evita que la página se recargue
      const autor = inputAutor.value.trim();
      const texto = inputTexto.value.trim();
      if (!autor || !texto || ws.readyState !== WebSocket.OPEN) return;

      ws.send(JSON.stringify({ autor, texto }));
      inputTexto.value = '';
      inputTexto.focus();
    };

    conectar();
  </script>
</body>
</html>
