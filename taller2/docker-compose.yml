services:
    cliente-api:
        build:
            context: ./cliente-api
            dockerfile: dockerfile
            target: development
        ports:
            - "${CLIENTE_PORT:-3001}:3001"
        env_file:
            - ./cliente-api/.env
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_NAME=${DB_NAME:-taller2_db}
            - DB_USER=${DB_USER:-postgres}
            - DB_PASSWORD=${DB_PASSWORD:-postgres}
            - PORT=3001
        volumes:
            - ./cliente-api:/app:Z
            - /app/node_modules
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    producto-api:
        build:
            context: ./producto-api
            dockerfile: dockerfile
            target: development
        ports:
            - "${PRODUCTO_PORT:-3002}:3002"
        env_file:
            - ./producto-api/.env
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_NAME=${DB_NAME:-taller2_db}
            - DB_USER=${DB_USER:-postgres}
            - DB_PASSWORD=${DB_PASSWORD:-postgres}
            - PORT=3002
        volumes:
            - ./producto-api:/app:Z
            - /app/node_modules
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    compra-api:
        build:
            context: ./compra-api
            dockerfile: dockerfile
            target: development
        ports:
            - "${COMPRA_PORT:-3003}:3003"
        env_file:
            - ./compra-api/.env
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_NAME=${DB_NAME:-taller2_db}
            - DB_USER=${DB_USER:-postgres}
            - DB_PASSWORD=${DB_PASSWORD:-postgres}
            - CLIENTE_API_URL=http://cliente-api:3001
            - PRODUCTO_API_URL=http://producto-api:3002
            - PORT=3003
        volumes:
            - ./compra-api:/app:Z
            - /app/node_modules
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    postgres:
        image: postgres:17-alpine
        container_name: postgres-db
        environment:
            - POSTGRES_USER=${DB_USER:-postgres}
            - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
            - POSTGRES_DB=${DB_NAME:-taller2_db}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql:Z
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-taller2_db}"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    pgdata: